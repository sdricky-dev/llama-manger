name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（node:test）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = 上一代 LTS，24 = 当前 LTS（也是 Electron 44 内嵌的 Node 大版本）；
        # 本地开发用 Node 26。不再测 Node 20：它已于 2026-04 EOL。
        node-version: ['22', '24']
    steps:
      # v7 起 action 自身跑在 node24 上（v4 是 node20，GitHub 已开始告警）
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        # 单测不启动 Electron，跳过约 100MB 的二进制下载
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: 跑单测
        run: npm test

  # 说明：e2e/ 下的脚本需要真实 Electron 窗口 + 本机 GGUF 模型，
  # 不适合云端 CI。本地跑法见 e2e/README.md：
  #   env -u ELECTRON_RUN_AS_NODE npx electron . --remote-debugging-port=9222
  #   LM_MODELS_DIR=~/.lmstudio/models node e2e/cdp-eval.js e2e/step21-mac-server.js
